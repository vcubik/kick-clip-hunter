name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 05:17 UTC. The application's dependencies are not pinned, so a
    # weekly run is what notices a new FastAPI / httpx / ffmpeg release
    # breaking something while nobody was changing the code.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this run needs the test suite at all. A pull request that changes
  # only Markdown (docs/, the README, CLAUDE.md) cannot break a test, so its
  # test jobs pass without running one. They still run and report rather
  # than being left out with `paths-ignore`: they are required checks, and a
  # required check that never reports keeps the pull request from merging.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          # Anything that is not Markdown - or a diff that came out empty -
          # runs the suite.
          if [ -z "$changed" ] || echo "$changed" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (the version pinned in requirements-dev.txt)
        run: python -m pip install "$(grep -E '^ruff' requirements-dev.txt | cut -d' ' -f1)"
      - name: Lint
        run: ruff check .
      - name: Check test formatting
        run: ruff format --check tests

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is what the service runs on; Linux keeps it portable.
        os: [windows-latest, ubuntu-latest]
    env:
      # The clip-cutting tests skip themselves on a machine without ffmpeg.
      # Here a missing ffmpeg is a broken setup and must fail instead.
      REQUIRE_FFMPEG: "1"
      # Every step but the last runs only when the suite is needed (see
      # `changes`).
      RUN_SUITE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_SUITE == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_SUITE == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg (Linux)
        if: env.RUN_SUITE == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # A full build straight from where it is published - gyan.dev's, the one
      # the service runs on, or BtbN's on GitHub when that cannot be had -
      # rather than through Chocolatey, whose community feed has been down
      # long enough to fail every run, and whose ffmpeg is a launcher in
      # front of the real one.
      - name: Install ffmpeg (Windows)
        if: env.RUN_SUITE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $sources = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $into = Join-Path $env:RUNNER_TEMP "ffmpeg"
          foreach ($source in $sources) {
            try {
              Invoke-WebRequest -Uri $source -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
              Expand-Archive -Path $zip -DestinationPath $into -Force
              break
            } catch {
              Write-Warning "ffmpeg could not be had from ${source}: $_"
            }
          }
          $found = Get-ChildItem -Path $into -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { throw "ffmpeg could not be installed from any source" }
          $found.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check ffmpeg
        if: env.RUN_SUITE == 'true'
        shell: bash
        run: ffmpeg -hide_banner -version | head -1 && ffprobe -hide_banner -version | head -1
      - name: Install dependencies
        if: env.RUN_SUITE == 'true'
        run: python -m pip install -r requirements-dev.txt
      # In parallel, one worker per CPU (pytest-xdist).
      - name: Run the test suite
        if: env.RUN_SUITE == 'true'
        run: python -m pytest -n auto --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage summary
        if: always() && env.RUN_SUITE == 'true'
        shell: bash
        run: |
          if [ -f .coverage ]; then
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always() && env.RUN_SUITE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
      - name: Say why the suite did not run
        if: env.RUN_SUITE != 'true'
        shell: bash
        run: echo "Only Markdown changed - the test suite is not needed." >> "$GITHUB_STEP_SUMMARY"
